name: daily-wake-v06
# v0.6's heartbeat. The creature at /o/teich-05 was migrated to v0.6.0 on 2026-11-01 (v06/book/MIGRATION_RECORD.json);
# daily_wake_v05.yml was retired in the same commit.
#
# Two gates before every wake, and a machine that fails either declines (elapsed seconds stay banked):
#   body  -- relive the body's fixture bit for bit (certified arithmetic, any CPU vendor, numpy 1.26 / 2.1)
#   dream -- dream the working surface's fixture bit for bit. Dreams go through OpenBLAS, which picks a kernel per CPU;
#            OPENBLAS_CORETYPE=Haswell + one thread made them identical on AMD Zen 3 and Intel AVX-512 across numpy
#            1.26.4 / 2.4.6 / 2.5.4 (2026-11-01). Without these two settings v0.5's GitHub dreams were not reproducible.
# RETIRED 2026-11-06: the creature was migrated to v0.7.0 (v07/book/MIGRATION_RECORD_v07.json); its heartbeat is
# daily_wake_v07.yml. v0.6's loader refuses a v0.7 state: a manual run fails without living (its lease is released).
on:
  # schedule:
  #   - cron: "11 6 * * *"        # after v0.1 (05:17), v0.2 (05:23), v0.3 (05:41), v0.4 (05:53)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-wake-v05          # the same creature and seat as v0.5's wake: never two at once
  cancel-in-progress: false

env:
  OPENBLAS_CORETYPE: Haswell
  OPENBLAS_NUM_THREADS: "1"

jobs:
  wake:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "numpy==1.26.4" "mpmath==1.3.0"
      - name: which machine drew this wake
        run: grep -m1 "model name" /proc/cpuinfo || true
      - name: dream gate, body gate, lease, replay (journaled), dream, commit, diary pages, public record log
        env:
          SEAT_KEY: ${{ secrets.SEAT_KEY }}
        run: |
          cd v06/seat && python3 -u wake_v06.py --max-ticks 172800 --diary-dir ../../v05/diary --log ../../v05/diary/records.jsonl
      - name: commit new diary pages and the record log
        run: |
          git config user.name "teich-v06"
          git config user.email "teich-v06@users.noreply.github.com"
          git add v05/diary || true
          if ! git diff --cached --quiet; then
            git commit -m "v0.6 diary: $(date -u +%F) (autonomous wake)"
            git push
          fi
