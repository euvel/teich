name: pilot-g1
# INTERIOR_SPEC v0.3 Gate 1 — C1 detectability screen (n=16/arm, frozen band).
# Same laws as the maturity campaign: gate-on-boot (certified draws only),
# retry loop across NIM rate-exhaustion, ledger committed to the book each
# segment. Ends when out_g1/pilot_g1_result.json exists; the cron then finds
# nothing to do and exits. Disable this workflow after the decision is read.
on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pilot-g1
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: body/requirements.txt
      - run: pip install -r body/requirements.txt "sentence-transformers==3.0.1" "transformers==4.44.2" "tokenizers==0.19.1" "huggingface_hub==0.24.7"
      - name: gate-on-boot (certified substrate only)
        id: gate
        run: |
          grep "model name" /proc/cpuinfo | head -1
          cd body && (python verify_substrate.py && echo "gate=pass" >> "$GITHUB_OUTPUT") \
            || { echo "non-certified draw — declining this slice (lawful)"; echo "gate=fail" >> "$GITHUB_OUTPUT"; }
      - name: run G1 slice (retry across rate-exhaustion cycles)
        if: steps.gate.outputs.gate == 'pass'
        env:
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
        run: |
          cd maturity/harness/pilot_v2
          if [ -f out_g1/pilot_g1_result.json ]; then echo "decision already exists"; exit 0; fi
          END=$(( $(date +%s) + 18000 ))
          while [ $(date +%s) -lt $END ]; do
            python3 -u pilot_g1.py || true
            if [ -f out_g1/pilot_g1_result.json ]; then echo "G1 DECISION REACHED"; break; fi
            git add out_g1/ && git -c user.name=teich-body -c user.email=teich-body@users.noreply.github.com \
              commit -m "pilot g1: mid-slice ledger checkpoint ($(wc -l < out_g1/pilot_g1_transcripts.jsonl) conversations)" \
              && { git pull --rebase origin main && git push origin main || git rebase --abort; } || true
            echo "segment ended; pausing 90s"; sleep 90
          done
      - name: commit ledger to the book
        if: always()
        run: |
          git config user.name "teich-body"
          git config user.email "teich-body@users.noreply.github.com"
          git rebase --abort 2>/dev/null || true
          git add maturity/harness/pilot_v2/out_g1/ || true
          if git diff --cached --quiet; then echo "no new pilot data"; exit 0; fi
          git commit -m "pilot g1: $(date -u +%F) slice ($(wc -l < maturity/harness/pilot_v2/out_g1/pilot_g1_transcripts.jsonl) conversations banked)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            echo "push attempt $i failed; retrying"; git rebase --abort 2>/dev/null || true; sleep 5
          done
