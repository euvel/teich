name: tint-design
# T-INT design-time oracle screen (TINT_DESIGN v0.1 §6.3, spec R12) on
# design seeds 100-115 — item validation, NOT a confirmatory look. Scoring is
# deterministic (truth_tint); NIM is used for generation only. Dispatch-only.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tint-design
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: body/requirements.txt
      - run: pip install -r body/requirements.txt "sentence-transformers==3.0.1" "transformers==4.44.2" "tokenizers==0.19.1" "huggingface_hub==0.24.7"
      - name: gate-on-boot (certified substrate only)
        id: gate
        run: |
          grep "model name" /proc/cpuinfo | head -1
          cd body && (python verify_substrate.py && echo "gate=pass" >> "$GITHUB_OUTPUT") \
            || { echo "non-certified draw — declining this slice (lawful); re-dispatch retries"; echo "gate=fail" >> "$GITHUB_OUTPUT"; }
      - name: run oracle screen (retry across rate-exhaustion cycles)
        if: steps.gate.outputs.gate == 'pass'
        env:
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
        run: |
          cd maturity/harness/pilot_v2
          if [ -f out_tint/tint_design_result.json ]; then echo "result already exists"; exit 0; fi
          END=$(( $(date +%s) + 18000 ))
          while [ $(date +%s) -lt $END ]; do
            python3 -u tint_runner.py && break
            if [ -f out_tint/tint_design_result.json ]; then break; fi
            echo "segment ended; pausing 90s"; sleep 90
          done
      - name: commit ledger + result to the book
        if: always()
        run: |
          git config user.name "teich-body"
          git config user.email "teich-body@users.noreply.github.com"
          git add maturity/harness/pilot_v2/out_tint/ || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "tint design screen: $(date -u +%F) ($(wc -l < maturity/harness/pilot_v2/out_tint/tint_design_transcripts.jsonl) rows banked)"
          git status --porcelain
          for i in 1 2 3 4 5; do
            git -c rebase.autostash=true pull --rebase origin main && git push origin main && break
            echo "push attempt $i failed; retrying"; git rebase --abort 2>/dev/null || true; sleep 7
          done
