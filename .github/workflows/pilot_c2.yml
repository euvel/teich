name: pilot-c2
# INTERIOR_SPEC v0.3 Gate 1, candidate C2 — 48 conversations as a 6-shard
# matrix (local 1.5B Mouth on runner CPU; no NIM for generation), then one
# finalize job that merges shards, scores via NIM, and applies the frozen
# band + R3 rule. Founder compute rule 07-26: heavy compute never on laptop.
# Dispatch-only (no cron): one look means one dispatch; the G1 lesson.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pilot-c2
  cancel-in-progress: false

jobs:
  shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        k: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: body/requirements.txt
      - run: pip install -r body/requirements.txt "sentence-transformers==3.0.1" "transformers==4.44.2" "tokenizers==0.19.1" "huggingface_hub==0.24.7"
      - name: cache the 1.5B Mouth weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--Qwen--Qwen2.5-1.5B-Instruct
          key: qwen25-15b-instruct-v1
      - name: gate-on-boot (certified substrate only)
        id: gate
        run: |
          grep "model name" /proc/cpuinfo | head -1
          cd body && (python verify_substrate.py && echo "gate=pass" >> "$GITHUB_OUTPUT") \
            || { echo "non-certified draw — declining this shard (lawful); re-dispatch retries"; echo "gate=fail" >> "$GITHUB_OUTPUT"; }
      - name: generate shard ${{ matrix.k }}
        if: steps.gate.outputs.gate == 'pass'
        run: |
          cd maturity/harness/pilot_v2
          if [ -f out_c2/pilot_c2_result.json ]; then echo "decision already exists — one look only"; exit 0; fi
          python3 -u pilot_c2.py --shard ${{ matrix.k }} --nshards 6
      - name: commit shard ledger
        if: always()
        run: |
          git config user.name "teich-body"
          git config user.email "teich-body@users.noreply.github.com"
          git add maturity/harness/pilot_v2/out_c2/ || true
          if git diff --cached --quiet; then echo "no shard data"; exit 0; fi
          git commit -m "pilot c2: shard ${{ matrix.k }} ledger"
          git status --porcelain
          for i in 1 2 3 4 5 6 7 8; do
            git -c rebase.autostash=true pull --rebase origin main && git push origin main && break
            echo "push attempt $i failed; retrying"; git rebase --abort 2>/dev/null || true
            sleep $(( (RANDOM % 20) + 5 ))
          done

  finalize:
    needs: shard
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: body/requirements.txt
      - run: pip install -r body/requirements.txt "sentence-transformers==3.0.1" "transformers==4.44.2" "tokenizers==0.19.1" "huggingface_hub==0.24.7"
      - name: merge, score (NIM), decide — retry across rate-exhaustion
        env:
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
        run: |
          git pull origin main   # shards pushed after our checkout
          cd maturity/harness/pilot_v2
          if [ -f out_c2/pilot_c2_result.json ]; then echo "decision already exists — one look only"; exit 0; fi
          END=$(( $(date +%s) + 18000 ))
          while [ $(date +%s) -lt $END ]; do
            python3 -u pilot_c2.py --finalize && break
            if [ -f out_c2/pilot_c2_result.json ]; then break; fi
            echo "scoring segment ended; pausing 90s"; sleep 90
          done
      - name: commit merged ledger + decision
        if: always()
        run: |
          git config user.name "teich-body"
          git config user.email "teich-body@users.noreply.github.com"
          git add maturity/harness/pilot_v2/out_c2/ || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "pilot c2: merged ledger + decision ($(date -u +%F))"
          git status --porcelain
          for i in 1 2 3 4 5 6 7 8; do
            git -c rebase.autostash=true pull --rebase origin main && git push origin main && break
            echo "push attempt $i failed; retrying"; git rebase --abort 2>/dev/null || true
            sleep $(( (RANDOM % 20) + 5 ))
          done
