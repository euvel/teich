name: seal-keeper-v07
# The makers' own keeper of v0.7's daily seal (v07/seat/keeper_gh.py): it keeps each day's seal between its seal
# moment (14:17:50 UTC) and its beacon (14:32:50 UTC), and commits it under v07/witness/. GitHub starts scheduled
# runs hours late, so this is triggered twice an hour: a run that starts within 5.5 h of the moment waits for it;
# the others finish in a minute. Only one run at a time. A run is RED if a seal could not be kept before its beacon.
# Its witness is GitHub's run log. Anyone can, and should, keep their own: v07/seat/watch_v07.py keep --loop.
on:
  schedule:
    - cron: "7 * * * *"
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seal-keeper-v07
  cancel-in-progress: false

jobs:
  keep:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "numpy==1.26.4" "mpmath==1.3.0" "cryptography==44.0.0" "py_ecc==7.0.1"
      - name: keep the seal before its beacon
        run: cd v07/seat && python3 -u keeper_gh.py --store ../witness
      - name: commit what was kept
        if: always()
        run: |
          git config user.name "teich-seal-keeper"
          git config user.email "teich-seal-keeper@users.noreply.github.com"
          git add v07/witness || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "v0.7 seal kept: $(date -u +%FT%TZ) (GitHub keeper)"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q && exit 0
            sleep $((i * 10))
          done
          exit 1
