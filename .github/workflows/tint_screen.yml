name: tint-screen
# T-INT confirmatory screen — pre-registered in maturity/harness/pilot_v2/
# TINT_CONFIG.json (founder Gate-0, 2026-07-26). 384 IC2 conversations as an
# 8-shard matrix, then a finalize job that merges, scores DETERMINISTICALLY
# (no judge), and applies the frozen DiD bar. Dispatch-only: ONE look.
on:
  workflow_dispatch:
    inputs:
      run_finalize:
        description: "Score and decide (only after the mapping rule is frozen)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tint-screen
  cancel-in-progress: false

jobs:
  shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        k: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: body/requirements.txt
      - run: pip install -r body/requirements.txt "sentence-transformers==3.0.1" "transformers==4.44.2" "tokenizers==0.19.1" "huggingface_hub==0.24.7"
      # Cache the Ears encoder: 8 runners fetching it simultaneously earned a
      # HuggingFace 429 on 2026-07-26 and cost shard 7 its entire slice.
      - name: cache the MiniLM Ears encoder
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--sentence-transformers--all-MiniLM-L6-v2
          key: minilm-l6-v2-v1
      - name: stagger shard start (spread HF + NIM boot bursts)
        run: sleep $(( ${{ matrix.k }} * 25 ))
      - name: gate-on-boot (certified substrate only)
        id: gate
        run: |
          grep "model name" /proc/cpuinfo | head -1
          cd body && (python verify_substrate.py && echo "gate=pass" >> "$GITHUB_OUTPUT") \
            || { echo "non-certified draw — declining this shard (lawful); re-dispatch regenerates only what is missing"; echo "gate=fail" >> "$GITHUB_OUTPUT"; }
      - name: generate shard ${{ matrix.k }} (retry across rate-exhaustion)
        if: steps.gate.outputs.gate == 'pass'
        env:
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
        run: |
          cd maturity/harness/pilot_v2
          if [ -f out_tint_screen/tint_screen_result.json ]; then echo "decision exists — one look only"; exit 0; fi
          # ONE worker per shard: 8 shards = 8 concurrent NIM calls total.
          # 2026-07-26 ran 4 workers/shard (32 concurrent) on one API key and
          # NIM 429'd continuously — 66 of 384 conversations in 4.5 hours.
          END=$(( $(date +%s) + 17000 ))
          while [ $(date +%s) -lt $END ]; do
            python3 -u pilot_tint.py --shard ${{ matrix.k }} --nshards 8 && break
            echo "segment ended (rate exhaustion); backing off 240s"; sleep 240
          done
      - name: commit shard ledger
        if: always()
        run: |
          git config user.name "teich-body"
          git config user.email "teich-body@users.noreply.github.com"
          git add maturity/harness/pilot_v2/out_tint_screen/ || true
          if git diff --cached --quiet; then echo "no shard data"; exit 0; fi
          git commit -m "tint screen: shard ${{ matrix.k }} ledger"
          git status --porcelain
          for i in 1 2 3 4 5 6 7 8; do
            git -c rebase.autostash=true pull --rebase origin main && git push origin main && break
            echo "push attempt $i failed; retrying"; git rebase --abort 2>/dev/null || true
            sleep $(( (RANDOM % 20) + 5 ))
          done

  # GENERATION-ONLY dispatch (blinded protocol, 2026-07-26): finalize is
  # gated OFF until the reply-mapping rule is rebuilt on design-seed data and
  # frozen. Scoring is a separate later dispatch with run_finalize=true, so no
  # confirmatory reply is ever read before the rule is committed.
  finalize:
    if: ${{ inputs.run_finalize }}
    needs: shard
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: body/requirements.txt
      - run: pip install -r body/requirements.txt "sentence-transformers==3.0.1" "transformers==4.44.2" "tokenizers==0.19.1" "huggingface_hub==0.24.7"
      - name: merge + score (deterministic, no API) + decide
        run: |
          git pull origin main    # shards pushed after our checkout
          cd maturity/harness/pilot_v2
          if [ -f out_tint_screen/tint_screen_result.json ]; then echo "decision exists"; exit 0; fi
          python3 -u pilot_tint.py --finalize
      - name: commit merged ledger + decision
        if: always()
        run: |
          git config user.name "teich-body"
          git config user.email "teich-body@users.noreply.github.com"
          git add maturity/harness/pilot_v2/out_tint_screen/ || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "tint screen: merged ledger + DiD decision ($(date -u +%F))"
          git status --porcelain
          for i in 1 2 3 4 5 6 7 8; do
            git -c rebase.autostash=true pull --rebase origin main && git push origin main && break
            echo "push attempt $i failed; retrying"; git rebase --abort 2>/dev/null || true
            sleep $(( (RANDOM % 20) + 5 ))
          done
