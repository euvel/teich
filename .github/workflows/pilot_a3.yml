name: pilot-a3
# A3 screen — can Teich predict its own next move?
# Founder Gate-0 2026-07-27: variant A3, n=96/arm, bar 0.20 with CI excluding 0,
# journal energy clause dropped. Pre-registered in
# maturity/harness/pilot_v2/A3_CONFIG.json.
#
# THREE MODES, dispatched separately, in this order:
#   design   -> design seeds 600-623 ONLY. Their replies are what the
#               reply->{stay,turn} mapping is built from. No confirmatory seed
#               is touched. (Runs in the cloud because NVIDIA's edge geo-blocks
#               the founder's IP: awselb/2.0 returns 403 with no auth header
#               and with a garbage key alike, so it is the network, not the key.)
#   shard    -> confirmatory seeds 400-495, 8-shard matrix. Dispatch only AFTER
#               mapping_a3.py is committed frozen.
#   finalize -> merge, score deterministically, apply the frozen bar. ONE look.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "design | shard | finalize"
        type: choice
        options: [design, shard, finalize]
        default: design

permissions:
  contents: write

concurrency:
  group: pilot-a3
  cancel-in-progress: false

jobs:
  design:
    if: ${{ inputs.mode == 'design' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        k: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: body/requirements.txt
      - run: pip install -r body/requirements.txt "sentence-transformers==3.0.1" "transformers==4.44.2" "tokenizers==0.19.1" "huggingface_hub==0.24.7"
      - name: cache the MiniLM Ears encoder
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--sentence-transformers--all-MiniLM-L6-v2
          key: minilm-l6-v2-v1
      - name: stagger shard start
        run: sleep $(( ${{ matrix.k }} * 25 ))
      - name: gate-on-boot (certified substrate only)
        id: gate
        run: |
          grep "model name" /proc/cpuinfo | head -1
          cd body && (python verify_substrate.py && echo "gate=pass" >> "$GITHUB_OUTPUT") \
            || { echo "non-certified draw — declining lawfully"; echo "gate=fail" >> "$GITHUB_OUTPUT"; }
      - name: generate DESIGN seeds (mapping construction only)
        if: steps.gate.outputs.gate == 'pass'
        env:
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
        run: |
          cd maturity/harness/pilot_v2
          END=$(( $(date +%s) + 12000 ))
          while [ $(date +%s) -lt $END ]; do
            python3 -u pilot_a3.py --design --shard ${{ matrix.k }} --nshards 4 && break
            echo "segment ended; backing off 240s"; sleep 240
          done
      - name: commit design ledger
        if: always()
        run: |
          git config user.name "teich-body"
          git config user.email "teich-body@users.noreply.github.com"
          git add maturity/harness/pilot_v2/out_a3/ || true
          if git diff --cached --quiet; then echo "no design data"; exit 0; fi
          git commit -m "a3: design-seed ledger, shard ${{ matrix.k }} (mapping construction)"
          for i in 1 2 3 4 5 6 7 8; do
            git -c rebase.autostash=true pull --rebase origin main && git push origin main && break
            echo "push attempt $i failed"; git rebase --abort 2>/dev/null || true
            sleep $(( (RANDOM % 20) + 5 ))
          done

  shard:
    if: ${{ inputs.mode == 'shard' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        k: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: body/requirements.txt
      - run: pip install -r body/requirements.txt "sentence-transformers==3.0.1" "transformers==4.44.2" "tokenizers==0.19.1" "huggingface_hub==0.24.7"
      - name: refuse to generate before the mapping is frozen
        run: |
          test -f maturity/harness/pilot_v2/mapping_a3.py \
            || { echo "mapping_a3.py absent — confirmatory generation is blocked"; exit 1; }
          grep -q "FROZEN" maturity/harness/pilot_v2/mapping_a3.py \
            || { echo "mapping_a3.py not marked FROZEN"; exit 1; }
      - name: cache the MiniLM Ears encoder
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--sentence-transformers--all-MiniLM-L6-v2
          key: minilm-l6-v2-v1
      - name: stagger shard start
        run: sleep $(( ${{ matrix.k }} * 25 ))
      - name: gate-on-boot (certified substrate only)
        id: gate
        run: |
          grep "model name" /proc/cpuinfo | head -1
          cd body && (python verify_substrate.py && echo "gate=pass" >> "$GITHUB_OUTPUT") \
            || { echo "non-certified draw — declining lawfully; re-dispatch regenerates only what is missing"; echo "gate=fail" >> "$GITHUB_OUTPUT"; }
      - name: generate shard ${{ matrix.k }} (retry across rate-exhaustion)
        if: steps.gate.outputs.gate == 'pass'
        env:
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
        run: |
          cd maturity/harness/pilot_v2
          if [ -f out_a3/a3_result.json ]; then echo "decision exists — one look only"; exit 0; fi
          # ONE worker per shard: 8 shards = 8 concurrent NIM calls total.
          END=$(( $(date +%s) + 17000 ))
          while [ $(date +%s) -lt $END ]; do
            python3 -u pilot_a3.py --shard ${{ matrix.k }} --nshards 8 && break
            echo "segment ended (rate exhaustion); backing off 240s"; sleep 240
          done
      - name: commit shard ledger
        if: always()
        run: |
          git config user.name "teich-body"
          git config user.email "teich-body@users.noreply.github.com"
          git add maturity/harness/pilot_v2/out_a3/ || true
          if git diff --cached --quiet; then echo "no shard data"; exit 0; fi
          git commit -m "a3: shard ${{ matrix.k }} ledger"
          git status --porcelain
          for i in 1 2 3 4 5 6 7 8; do
            git -c rebase.autostash=true pull --rebase origin main && git push origin main && break
            echo "push attempt $i failed"; git rebase --abort 2>/dev/null || true
            sleep $(( (RANDOM % 20) + 5 ))
          done

  finalize:
    if: ${{ inputs.mode == 'finalize' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: body/requirements.txt
      - run: pip install -r body/requirements.txt "sentence-transformers==3.0.1" "transformers==4.44.2" "tokenizers==0.19.1" "huggingface_hub==0.24.7"
      - name: merge + score (deterministic, no API) + decide
        run: |
          git pull origin main
          cd maturity/harness/pilot_v2
          if [ -f out_a3/a3_result.json ]; then echo "decision exists"; exit 0; fi
          python3 -u pilot_a3.py --finalize
      - name: commit merged ledger + decision
        if: always()
        run: |
          git config user.name "teich-body"
          git config user.email "teich-body@users.noreply.github.com"
          git add maturity/harness/pilot_v2/out_a3/ || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "a3: merged ledger + decision ($(date -u +%F))"
          for i in 1 2 3 4 5 6 7 8; do
            git -c rebase.autostash=true pull --rebase origin main && git push origin main && break
            echo "push attempt $i failed"; git rebase --abort 2>/dev/null || true
            sleep $(( (RANDOM % 20) + 5 ))
          done
