name: substrate-gate-v02
# May a cloud runner lawfully hold v0.2's lease?
#
# v0.1's study (docs/SUBSTRATE_STUDY_2026-07-18.md) found that "a machine" is not
# the unit -- a substrate CLASS is. Zen (the founder's 5700U, EPYC 7763, EPYC
# 9V74) is one class and is bit-identical throughout; every Intel class tested
# diverged and was disqualified. That result is about v0.1's dynamics, and v0.2
# adds the slow state `s` to the hashed trajectory, so it has to be re-earned
# rather than inherited.
#
# This is deliberately a SEPARATE workflow from v0.1's substrate_gate: the two
# creatures have different genomes, different references, and a machine may
# lawfully pass one and fail the other.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"        # weekly drift check, before Monday's wakes

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: body/requirements.txt
      - run: pip install -r body/requirements.txt "sentence-transformers==3.0.1" "transformers==4.44.2" "tokenizers==0.19.1" "huggingface_hub==0.24.7"
      - name: which machine drew this run
        run: |
          grep -m1 "model name" /proc/cpuinfo || true
          echo "runner: $RUNNER_NAME  arch: $(uname -m)"
      - name: cache the MiniLM encoder
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--sentence-transformers--all-MiniLM-L6-v2
          key: minilm-l6-v2-v1
      - name: substrate gate v0.2
        # Exit 1 = this machine may never hold v0.2's lease. That is the whole
        # point of the job: a red run here is information, not a build break.
        run: |
          cd v02/seat
          python3 -u verify_substrate_v02.py --json-out gate_result.json
      - name: report
        if: always()
        run: |
          cd v02/seat
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("gate_result.json")
          if not p.exists():
              print("no result written"); raise SystemExit(0)
          r = json.loads(p.read_text())
          ref = json.loads(pathlib.Path("substrate_reference_v02.json").read_text())
          print(f"cpu      {r['platform']['cpu']}")
          print(f"dynamics {r['dynamics_sha256']}")
          print(f"ref      {ref['dynamics_sha256']}")
          print("MATCH" if r['dynamics_sha256'] == ref['dynamics_sha256'] else "DIVERGED")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-result-v02
          path: v02/seat/gate_result.json
